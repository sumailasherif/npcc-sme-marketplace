<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="text-scale" content="scale">
  <meta name="color-scheme" content="light dark">
  <script>try{var _t=localStorage.getItem("bazar-theme");if(_t==="dark"||_t==="light"){document.documentElement.setAttribute("data-theme",_t);document.querySelector('meta[name="color-scheme"]').content=_t;}}catch(e){}</script>
  <meta name="theme-color" content="#f4f0e6">
  <title>Bazar — Map</title>
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="app.css">
  <!-- Map engine: MapLibre GL (open source). Map tiles: OpenFreeMap. No API key needed. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    /* Language switcher + profile menu */
    .pop-wrap { position: relative; }
    .lang-btn {
      width: 36px; height: 36px; border-radius: 999px;
      background: var(--lime); border: 2px solid var(--black);
      display: grid; place-items: center; padding: 0; margin-right: 4px;
    }
    .lang-btn svg { width: 22px; height: 22px; border-radius: 999px; display: block; }
    .profile-btn {
      width: 38px; height: 38px; border-radius: 999px;
      background: var(--black); color: var(--lime);
      display: grid; place-items: center; font-weight: 700; font-size: 0.8125rem;
    }
    .pop-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
      min-width: 196px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 6px; box-shadow: 0 14px 32px rgba(14, 14, 12, 0.18);
      display: none; flex-direction: column; gap: 2px;
    }
    .pop-menu.open { display: flex; }
    .pop-menu a, .pop-menu button {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
      font-size: 0.8125rem; font-weight: 600; color: var(--black); text-align: left; width: 100%;
    }
    .pop-menu a:hover, .pop-menu button:hover { background: var(--cream); }
    .pop-menu button.on { background: var(--black); color: var(--lime); }
    .pop-menu svg { width: 18px; height: 18px; flex: none; }
    .pop-sep { height: 1px; background: var(--line); margin: 4px 6px; }

    /* ───── MAP AREA: fills the space between the top bar and the tab bar ───── */
    main.map-main {
      position: relative; padding: 0;
      height: calc(100svh - var(--top-bar) - var(--tab-bar) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      min-height: 420px;
    }
    #map { position: absolute; inset: 0; background: var(--cream); }

    /* Top overlay: location status + find me + category filter strip */
    .map-top {
      position: absolute; top: 12px; left: var(--gutter); right: var(--gutter); z-index: 5;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .map-top-row {
      display: flex; align-items: center; gap: 8px; pointer-events: none;
    }
    .map-top-row > *, .map-cats > * { pointer-events: auto; }
    .map-cats {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
      pointer-events: auto;
    }
    .map-cats::-webkit-scrollbar { display: none; }
    .map-cat-btn {
      flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line);
      font-size: 0.75rem; font-weight: 700; color: var(--black-2);
      box-shadow: 0 4px 12px rgba(14, 14, 12, 0.1);
    }
    .map-cat-btn.on { background: var(--black); color: var(--lime); border-color: var(--black); }
    :root[data-theme="dark"] .map-cat-btn.on { background: var(--lime); color: #0e0e0c; border-color: var(--lime); }

    .loc-chip {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; max-width: 100%;
      padding: 6px 14px 6px 8px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(14, 14, 12, 0.12);
      font-size: var(--label); font-weight: 600;
    }
    .loc-chip .pin {
      width: 24px; height: 24px; border-radius: 999px; background: var(--lime); color: var(--black);
      display: grid; place-items: center; flex: none;
    }
    .loc-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .find-btn {
      margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px;
      background: var(--black); color: var(--lime); font-size: 0.8125rem; font-weight: 700;
      box-shadow: 0 8px 24px rgba(14, 14, 12, 0.28);
    }

    /* Bottom overlay: selected place card + nearby strip */
    .map-bottom {
      position: absolute; left: var(--gutter); right: var(--gutter); bottom: 12px; z-index: 5;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .map-bottom > * { pointer-events: auto; }

    .place {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 14px; box-shadow: 0 14px 36px rgba(14, 14, 12, 0.2);
      display: none; flex-direction: column; gap: 12px;
    }
    .place.show { display: flex; }
    .place-head { display: flex; align-items: center; gap: 12px; }
    .mono {
      width: 44px; height: 44px; border-radius: 12px; background: var(--black); color: var(--lime);
      display: grid; place-items: center; font-weight: 700; font-size: 1.0625rem; flex: none;
    }
    .place-name { font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; }
    .place-meta { color: var(--muted); font-size: var(--caption); margin-top: 2px; }
    .place-close {
      margin-left: auto; width: 40px; height: 40px; border-radius: 999px; flex: none;
      display: grid; place-items: center; color: var(--black);
    }
    .place-close:hover { background: var(--line); }

    .dist-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dist-box { background: var(--cream); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
    .dist-box small { display: block; font-size: 0.6875rem; font-weight: 600; color: var(--muted); }
    .dist-box b { display: block; margin-top: 3px; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; }
    .dist-box b.wait { font-size: 0.8125rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .dist-note { font-size: var(--caption); color: var(--muted); }

    .place-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .place-actions .btn { flex: 1; min-height: 44px; padding: 0 14px; font-size: 0.8125rem; }
    .btn-ghost { background: var(--cream); border: 1px solid var(--line); color: var(--black); }

    .nearby { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .nearby::-webkit-scrollbar { display: none; }
    .near-chip {
      flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
      padding: 6px 14px 6px 6px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(14, 14, 12, 0.12);
      font-size: var(--label); font-weight: 600; white-space: nowrap;
    }
    .near-chip .mono { width: 32px; height: 32px; border-radius: 999px; font-size: 0.8125rem; }
    .near-chip .km { color: var(--lime-ink); font-weight: 700; }
    .near-chip.on { background: var(--black); color: var(--card); border-color: var(--black); }
    .near-chip.on .mono { background: var(--lime); color: var(--black); }
    .near-chip.on .km { color: var(--lime); }

    /* Map pins */
    .shop-pin {
      width: 36px; height: 36px; border-radius: 999px; background: var(--black); color: var(--lime);
      display: grid; place-items: center; font: 700 13px/1 var(--font);
      border: 2.5px solid var(--card); box-shadow: 0 6px 16px rgba(14, 14, 12, 0.35); cursor: pointer;
      transition: transform .15s;
    }
    .shop-pin:hover { transform: scale(1.1); }
    .shop-pin.on { background: var(--lime); color: var(--black); border-color: var(--black); transform: scale(1.18); z-index: 4; }
    .drop-pin {
      width: 22px; height: 22px; border-radius: 999px; background: var(--card);
      border: 6px solid var(--black); box-shadow: 0 6px 16px rgba(14, 14, 12, 0.35);
    }
    .me-dot {
      width: 20px; height: 20px; border-radius: 999px; background: var(--lime);
      border: 4px solid var(--black); box-shadow: 0 0 0 8px rgba(212, 245, 60, 0.35);
    }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    .maplibregl-ctrl-group { border-radius: 12px !important; overflow: hidden; }

    /* ───── LAPTOP: card + nearby list sit in a left panel ───── */
    @media (min-width: 80em) {
      .map-bottom {
        top: 108px; bottom: 16px; right: auto; width: 360px;
      }
      .nearby { flex-direction: column; overflow-y: auto; overflow-x: hidden; flex: 1; padding-right: 4px; }
      .near-chip { width: 100%; border-radius: 16px; }
      .near-chip .km { margin-left: auto; }
    }

    @keyframes placeSlideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .place.show { animation: placeSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
    }
    :root[data-theme="dark"] .shop-pin {
      background: #1a1e15; color: var(--lime); border-color: rgba(212, 245, 60, 0.45);
    }
    :root[data-theme="dark"] .shop-pin.on {
      background: var(--lime); color: #0e0e0c; border-color: #0e0e0c;
    }
    :root[data-theme="dark"] .me-dot {
      border-color: #10120e;
    }
  </style>
</head>
<body>

  <header class="app-bar">

            <svg aria-hidden="true" viewBox="0 0 60 60" id="langFlagSvg"><clipPath id="m-en"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#m-en)"><rect width="60" height="60" fill="#012169"/><path d="M0 0L60 60M60 0L0 60" stroke="#fff" stroke-width="10"/><path d="M0 0L60 60M60 0L0 60" stroke="#C8102E" stroke-width="5"/><path d="M30 0V60M0 30H60" stroke="#fff" stroke-width="14"/><path d="M30 0V60M0 30H60" stroke="#C8102E" stroke-width="8"/></g></svg>
          </button>

            <button type="button" data-lang="fr" onclick="setLang('fr')"><svg aria-hidden="true" viewBox="0 0 60 60" style="border-radius:999px"><clipPath id="mm-fr"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#mm-fr)"><rect width="20" height="60" fill="#002395"/><rect x="20" width="20" height="60" fill="#fff"/><rect x="40" width="20" height="60" fill="#ED2939"/></g></svg> Français</button>
            <button type="button" data-lang="mfe" onclick="setLang('mfe')"><svg aria-hidden="true" viewBox="0 0 60 60" style="border-radius:999px"><clipPath id="mm-mu"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#mm-mu)"><rect width="60" height="15" fill="#EA2839"/><rect y="15" width="60" height="15" fill="#1A206D"/><rect y="30" width="60" height="15" fill="#FFD500"/><rect y="45" width="60" height="15" fill="#00A551"/></g></svg> Kreol Morisien</button>

        </a>

        <a class="icon-btn" href="index.html?drawer=orders" aria-label="Cart">

        <div class="pop-wrap">

  <main class="map-main">
    <div id="map" role="region" aria-label="Map of businesses"></div>

    <!-- TOP: location status + find me + 7-category filter -->
    <div class="map-top">
      <div class="map-top-row">
        <div class="loc-chip" aria-live="polite">
          <span class="pin" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/></svg></span>
          <span id="locStatus">Tap Find me to see distances</span>
        </div>
        <button type="button" class="find-btn" onclick="findMe()">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          <span data-text="map.find">Find me</span>
        </button>
      </div>
      <div class="map-cats" id="mapCats" role="group" aria-label="Filter map pins by category">
        <button type="button" class="map-cat-btn on" data-cat="all" onclick="filterMapCat('all')">All (43)</button>
        <button type="button" class="map-cat-btn" data-cat="food" onclick="filterMapCat('food')">Food &amp; Cafés</button>
        <button type="button" class="map-cat-btn" data-cat="phones" onclick="filterMapCat('phones')">Phones &amp; Tech</button>
        <button type="button" class="map-cat-btn" data-cat="fashion" onclick="filterMapCat('fashion')">Fashion</button>
        <button type="button" class="map-cat-btn" data-cat="salons" onclick="filterMapCat('salons')">Salons &amp; Spa</button>
        <button type="button" class="map-cat-btn" data-cat="home" onclick="filterMapCat('home')">Home &amp; Living</button>
        <button type="button" class="map-cat-btn" data-cat="vehicles" onclick="filterMapCat('vehicles')">Vehicles</button>
        <button type="button" class="map-cat-btn" data-cat="kids" onclick="filterMapCat('kids')">Kids &amp; Family</button>
      </div>
    </div>

    <!-- BOTTOM: selected place + nearby list -->
    <div class="map-bottom">
      <section class="place" id="place" aria-live="polite">
        <div class="place-head">
          <span class="mono" id="placeMono">B</span>
          <div>
            <div class="place-name" id="placeName"></div>
            <div class="place-meta" id="placeMeta"></div>
          </div>
          <button type="button" class="place-close" aria-label="Close" onclick="clearSelection()">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="dist-row">
          <div class="dist-box"><small data-text="map.straight">Straight line</small><b id="distStraight" class="wait">—</b></div>
          <div class="dist-box"><small data-text="map.road">By road</small><b id="distRoad" class="wait">—</b></div>
        </div>
        <p class="dist-note" id="distNote">Turn on your location to measure the distance.</p>
        <div class="place-actions">
          <button type="button" class="btn btn-black" id="routeBtn" onclick="getRoute()">Show route</button>
          <a href="/s/chelseas" class="btn btn-lime" id="openShopLink">Open Shop ↗</a>

  </nav>

  <script src="shops-data.js"></script>
  <script>
    var shops = (window.BAZAR_SHOPS || []).map(function (s) {
      return {
        id: s.id,
        cat: s.cat,
        name: s.name,
        meta: s.meta,
        mono: s.name.charAt(0).toUpperCase(),
        lng: s.lng,
        lat: s.lat
      };
    });

    var activeMapCat = "all";
    var me = null;
    var selected = null;
    var meMarker = null, dropMarker = null;
    var pinMarkers = {};
    var pinEls = {};
    var lastRouteGeometry = null;

    function currentMapStyle() {
      return document.documentElement.getAttribute("data-theme") === "dark"
        ? "https://tiles.openfreemap.org/styles/dark"
        : "https://tiles.openfreemap.org/styles/positron";
    }

    var map = new maplibregl.Map({
      container: "map",
      style: currentMapStyle(),
      center: [57.53, -20.22],
      zoom: 9.7,
      minZoom: 8,
      maxBounds: [[56.9, -20.75], [58.1, -19.6]],
      attributionControl: { compact: true }
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

    function setupMapLayers() {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      try {
        if (!isDark && map.getLayer("background")) {
          map.setPaintProperty("background", "background-color", "#f4f0e6");
        }
      } catch (e) {}
      if (!map.getSource("route")) {
        map.addSource("route", {
          type: "geojson",
          data: lastRouteGeometry
            ? { type: "Feature", geometry: lastRouteGeometry }
            : { type: "FeatureCollection", features: [] }
        });
        map.addLayer({
          id: "route-casing",
          type: "line",
          source: "route",
          paint: { "line-color": "#d4f53c", "line-width": 9 },
          layout: { "line-cap": "round", "line-join": "round" }
        });
        map.addLayer({
          id: "route-line",
          type: "line",
          source: "route",
          paint: { "line-color": "#0e0e0c", "line-width": 4 },
          layout: { "line-cap": "round", "line-join": "round" }
        });
      }
    }

    map.on("style.load", setupMapLayers);
    window.addEventListener("bazar-theme-change", function () {
      map.setStyle(currentMapStyle());
    });

    // Build all 43 shop markers
    shops.forEach(function (s) {
      var el = document.createElement("button");
      el.type = "button";
      el.className = "shop-pin";
      el.textContent = s.mono;
      el.setAttribute("aria-label", s.name);
      el.addEventListener("click", function (ev) { ev.stopPropagation(); select(s); });
      pinEls[s.id] = el;
      pinMarkers[s.id] = new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map);
    });

    function filterMapCat(cat) {
      activeMapCat = cat;
      document.querySelectorAll("#mapCats .map-cat-btn").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-cat") === cat);
      });
      shops.forEach(function (s) {
        var visible = cat === "all" || s.cat === cat;
        pinEls[s.id].style.display = visible ? "" : "none";
      });
      renderNearby();
    }

    map.on("click", function (e) {
      var p = { custom: true, lng: e.lngLat.lng, lat: e.lngLat.lat };
      if (!dropMarker) {
        var d = document.createElement("div"); d.className = "drop-pin";
        dropMarker = new maplibregl.Marker({ element: d });
      }
      dropMarker.setLngLat([p.lng, p.lat]).addTo(map);
      select(p);
    });

    function kmBetween(a, b) {
      var R = 6371, toRad = Math.PI / 180;
      var dLat = (b.lat - a.lat) * toRad, dLng = (b.lng - a.lng) * toRad;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    function fmtKm(km) { return km < 1 ? Math.round(km * 1000) + " m" : (km < 10 ? km.toFixed(1) : Math.round(km)) + " km"; }
    function fmtMin(sec) {
      var m = Math.round(sec / 60);
      return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
    }

    function setStatus(t) { document.getElementById("locStatus").textContent = t; }
    function findMe() {
      if (!("geolocation" in navigator)) { setStatus("This browser can't share your location"); return; }
      setStatus("Finding your location…");
      navigator.geolocation.getCurrentPosition(function (pos) {
        me = { lng: pos.coords.longitude, lat: pos.coords.latitude };
        if (!meMarker) {
          var el = document.createElement("div"); el.className = "me-dot";
          meMarker = new maplibregl.Marker({ element: el });
        }
        meMarker.setLngLat([me.lng, me.lat]).addTo(map);
        setStatus("You are here");
        map.flyTo({ center: [me.lng, me.lat], zoom: Math.max(map.getZoom(), 11.5) });
        renderNearby();
        if (selected) showDistances();
      }, function (err) {
        setStatus(err.code === 1 ? "Location is blocked — allow it in your browser" : "Couldn't find your location. Try again");
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }

    function select(p) {
      selected = p;
      Object.keys(pinEls).forEach(function (id) { pinEls[id].classList.toggle("on", !p.custom && p.id === id); });
      if (!p.custom && dropMarker) dropMarker.remove();
      document.getElementById("placeMono").textContent = p.custom ? "•" : p.mono;
      document.getElementById("placeName").textContent = p.custom ? "Dropped pin" : p.name;
      document.getElementById("placeMeta").textContent = p.custom ? p.lat.toFixed(4) + ", " + p.lng.toFixed(4) : p.meta;
      var shopLink = document.getElementById("openShopLink");
      if (shopLink) {
        shopLink.style.display = p.custom ? "none" : "inline-flex";
        if (!p.custom) shopLink.href = "/s/" + encodeURIComponent(p.id);
      }
      document.getElementById("place").classList.add("show");
      clearRoute();
      showDistances();
      renderNearby();
      if (!p.custom) map.easeTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 12.8) });
    }
    function clearSelection() {
      selected = null;
      document.getElementById("place").classList.remove("show");
      Object.keys(pinEls).forEach(function (id) { pinEls[id].classList.remove("on"); });
      if (dropMarker) dropMarker.remove();
      clearRoute();
      renderNearby();
    }

    function showDistances() {
      var s = document.getElementById("distStraight"), r = document.getElementById("distRoad");
      var note = document.getElementById("distNote");
      r.textContent = "—"; r.className = "wait";
      if (!me) {
        s.textContent = "—"; s.className = "wait";
        note.textContent = "Turn on your location to measure the distance.";
        return;
      }
      s.textContent = fmtKm(kmBetween(me, selected)); s.className = "";
      note.textContent = "Tap Show route for the distance and time by car.";
    }

    function getRoute() {
      if (!selected) return;
      if (!me) { findMe(); return; }
      var r = document.getElementById("distRoad"), note = document.getElementById("distNote");
      r.textContent = "Calculating…"; r.className = "wait";
      var url = "https://router.project-osrm.org/route/v1/driving/" +
        me.lng + "," + me.lat + ";" + selected.lng + "," + selected.lat + "?overview=full&geometries=geojson";
      fetch(url).then(function (res) { return res.json(); }).then(function (data) {
        if (!data.routes || !data.routes.length) throw new Error("no route");
        var route = data.routes[0];
        lastRouteGeometry = route.geometry;
        r.textContent = fmtKm(route.distance / 1000) + " · " + fmtMin(route.duration); r.className = "";
        note.textContent = "Driving estimate. Real time depends on traffic.";
        if (map.getSource("route")) map.getSource("route").setData({ type: "Feature", geometry: route.geometry });
        var b = new maplibregl.LngLatBounds();
        route.geometry.coordinates.forEach(function (c) { b.extend(c); });
        var laptop = window.matchMedia("(min-width: 80em)").matches;
        map.fitBounds(b, { padding: laptop ? { top: 110, bottom: 60, left: 400, right: 60 } : { top: 110, bottom: 300, left: 40, right: 40 }, maxZoom: 15 });
      }).catch(function () {
        r.textContent = "—"; r.className = "wait";
        note.textContent = "Couldn't get the road distance. Try again.";
      });
    }
    function clearRoute() {
      lastRouteGeometry = null;
      if (map.getSource && map.getSource("route")) map.getSource("route").setData({ type: "FeatureCollection", features: [] });
    }

    function renderNearby() {
      var list = shops.filter(function (s) { return activeMapCat === "all" || s.cat === activeMapCat; });
      if (me) list.sort(function (a, b) { return kmBetween(me, a) - kmBetween(me, b); });
      var wrap = document.getElementById("nearby");
      wrap.innerHTML = "";
      list.forEach(function (s) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "listitem");
        b.className = "near-chip" + (selected && !selected.custom && selected.id === s.id ? " on" : "");
        b.innerHTML = '<span class="mono"></span><span class="nm"></span>' + (me ? '<span class="km"></span>' : "");
        b.querySelector(".mono").textContent = s.mono;
        b.querySelector(".nm").textContent = s.name;
        if (me) b.querySelector(".km").textContent = fmtKm(kmBetween(me, s));
        b.onclick = function () { select(s); };
        wrap.appendChild(b);
      });
    }
    renderNearby();

    // Auto-select a shop when opened from Home (?shop=<id>)
    try {
      var qShop = new URLSearchParams(window.location.search).get("shop");
      if (qShop) {
        var found = shops.find(function (s) { return s.id === qShop; });
        if (found) setTimeout(function () { select(found); }, 180);
      }
    } catch (e) {}

    function togglePop(id, triggerBtn) {
      document.querySelectorAll(".pop-menu").forEach(function (m) {
        if (m.id !== id) {
          m.classList.remove("open");
          var b = m.parentElement && m.parentElement.querySelector("button[aria-expanded]");
          if (b) b.setAttribute("aria-expanded", "false");
        }
      });
      var open = document.getElementById(id).classList.toggle("open");
      if (triggerBtn) triggerBtn.setAttribute("aria-expanded", String(open));
    }
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".pop-wrap")) {
        document.querySelectorAll(".pop-menu").forEach(function (m) {
          m.classList.remove("open");
          var b = m.parentElement && m.parentElement.querySelector("button[aria-expanded]");
          if (b) b.setAttribute("aria-expanded", "false");
        });
      }
    });
    var flags = {
      en: '<clipPath id="m-en"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#m-en)"><rect width="60" height="60" fill="#012169"/><path d="M0 0L60 60M60 0L0 60" stroke="#fff" stroke-width="10"/><path d="M0 0L60 60M60 0L0 60" stroke="#C8102E" stroke-width="5"/><path d="M30 0V60M0 30H60" stroke="#fff" stroke-width="14"/><path d="M30 0V60M0 30H60" stroke="#C8102E" stroke-width="8"/></g>',
      fr: '<clipPath id="m-fr"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#m-fr)"><rect width="20" height="60" fill="#002395"/><rect x="20" width="20" height="60" fill="#fff"/><rect x="40" width="20" height="60" fill="#ED2939"/></g>',
      mfe: '<clipPath id="m-mu"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#m-mu)"><rect width="60" height="15" fill="#EA2839"/><rect y="15" width="60" height="15" fill="#1A206D"/><rect y="30" width="60" height="15" fill="#FFD500"/><rect y="45" width="60" height="15" fill="#00A551"/></g>'
    };
    function setLang(code) {
      if (!flags[code]) return;
      document.getElementById("langFlagSvg").innerHTML = flags[code];
      document.querySelectorAll("#langMenu button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-lang") === code); });
      document.getElementById("langMenu").classList.remove("open");
      document.getElementById("langBtn").setAttribute("aria-expanded", "false");
      try { localStorage.setItem("bazar-lang", code); } catch (e) {}
    }
    try { var sl = localStorage.getItem("bazar-lang"); if (sl && flags[sl]) setLang(sl); } catch (e) {}
  </script>
  <script src="i18n.js"></script>
  <script src="edit-text.js"></script>
</body>
</html>
