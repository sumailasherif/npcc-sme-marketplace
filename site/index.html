<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazar — Landing</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 64px 16px;
    }
    .hero h1 {
      font-weight: 600;
      font-size: clamp(40px, 6.2vw, 88px);
      line-height: 1.02;
      letter-spacing: -0.045em;
      max-width: 1200px;
    }
    .hero .sub {
      margin-top: 20px;
      font-size: clamp(16px, 1.6vw, 22px);
      line-height: 1.4;
      color: var(--black-2);
      max-width: 640px;
    }
    .hero .actions { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px;
      border-radius: 999px; font-size: 15px; font-weight: 600;
    }
    .btn-lime  { background: var(--lime); color: var(--black); }
    .btn-black { background: var(--black); color: var(--card); }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <h1 data-text="hero.title">One place for every Mauritian business</h1>
    <p class="sub" data-text="hero.subtitle">Shop local brands, sell what you don't need, and grow your business — all on Bazar.</p>
    <div class="actions">
      <a href="#" class="btn btn-lime" data-text="hero.button-1">Start shopping</a>
      <a href="#" class="btn btn-black" data-text="hero.button-2">Open your shop</a>
    </div>
  </section>

  <script src="edit-text.js"></script>
</body>
</html>
