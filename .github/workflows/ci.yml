name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # A throwaway local Supabase in Docker: runs every migration from
      # scratch, then the RLS and end-to-end tests use it. Never touches
      # the real project.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Export local Supabase settings for tests
        run: bash scripts/supabase-test-env.sh >> "$GITHUB_ENV"

      - name: Database security (RLS) tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (360px)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
